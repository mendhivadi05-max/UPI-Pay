<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Choose a UPI app to pay Medhansh Khattar.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>Pay Medhansh Khattar</title>
  <style>
    html, body { min-height: 100%; }
    body { margin: 0; padding: 24px 16px; color: #17191f; background: #f5f6f8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    .payment-shell { width: 100%; max-width: 440px; margin: 0 auto; }
    .payment-card { padding: 24px; border: 1px solid #dfe2e8; border-radius: 22px; background: #fff; }
    [hidden] { display: none !important; }
  </style>
  <link id="site-styles" rel="stylesheet" media="not all" href="./styles.css?v=5">
  <script src="./app.js?v=5" defer></script>
</head>
<body>
  <main class="payment-shell">
    <section class="payment-card" aria-labelledby="page-title">
      <header class="payee-header">
        <div class="avatar" aria-hidden="true">MK</div>
        <div class="payee-details">
          <p class="kicker">Pay via UPI</p>
          <h1 id="page-title">Medhansh Khattar</h1>
          <p class="upi-id"><span>UPI ID</span> medhanshkhattar05@okicici</p>
        </div>
      </header>

      <form id="payment-form" novalidate>
        <div class="field-heading">
          <label for="amount">Amount</label>
          <span>Required</span>
        </div>
        <div class="amount-field">
          <span class="currency" aria-hidden="true">₹</span>
          <input id="amount" name="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0" maxlength="12" aria-describedby="amount-error">
        </div>

        <div class="quick-amounts" aria-label="Suggested amounts">
          <button type="button" data-amount="50">₹50</button>
          <button type="button" data-amount="100">₹100</button>
          <button type="button" data-amount="200">₹200</button>
          <button type="button" data-amount="500">₹500</button>
        </div>

        <div class="field-heading description-heading">
          <label for="description">Description</label>
          <span><span id="description-count">0</span>/80 · Optional</span>
        </div>
        <input class="text-field" id="description" name="description" type="text" autocomplete="off" placeholder="Lunch, event fee, etc." maxlength="80">

        <p id="amount-error" class="field-error" role="alert" aria-live="polite" hidden></p>
        <button id="continue-button" class="primary-button" type="submit" disabled>Choose payment app</button>
      </form>

      <section id="app-picker" class="app-picker" aria-labelledby="app-picker-title" hidden>
        <div class="picker-heading">
          <div>
            <p class="kicker">Payment app</p>
            <h2 id="app-picker-title">Choose where to pay</h2>
          </div>
          <button id="edit-payment" class="text-button" type="button">Edit details</button>
        </div>
        <div id="app-list" class="app-list"></div>
        <p id="launch-status" class="launch-status" role="status" aria-live="polite"></p>
      </section>

      <noscript>
        <p class="noscript-note">JavaScript is required to prepare the UPI payment links. Open this page in Chrome or Samsung Internet.</p>
      </noscript>

      <p class="safety-note">Your UPI PIN is entered only in the payment app you choose.</p>
    </section>

    <p class="page-note">Verify the recipient, amount, and description in your UPI app before paying.</p>
  </main>
</body>
</html>
